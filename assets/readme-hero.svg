<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Retail Vision AI & 3D Digital Twin Architectural Banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05080F"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#1E293B" stroke-opacity="0.4" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="10" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="10" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="318" rx="9" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Telemetry Bar -->
  <line x1="0" y1="44" x2="1280" y2="44" stroke="#1E293B" stroke-width="1.5"/>
  <text x="44" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5">SYS.ID // PEOYECTO-RETAIL</text>
  <text x="1236" y="28" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1.5">DOMAIN // EDGE COMPUTER VISION & INVENTORY AUTOMATION</text>

  <!-- Title & Subtitle -->
  <g transform="translate(44, 84)">
    <text x="0" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="2">PYTORCH // YOLO11 // RT-DETR // HAILO-8L NPU // THREE.JS</text>
    <text x="0" y="46" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="800" fill="#F8FAFC" letter-spacing="-0.8">Retail Vision AI & 3D Digital Twin</text>
    <text x="0" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#94A3B8">Autonomous retail shelf auditing powered by Raspberry Pi 5 + Hailo-8L NPU (13 TOPS) and WBF ensemble.</text>

    <!-- 4 Metric Boxes -->
    <g transform="translate(0, 112)">
      <rect x="0" y="0" width="280" height="68" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text x="18" y="25" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">WBF ENSEMBLE mAP</text>
      <text x="18" y="50" font-family="'JetBrains Mono', Consolas, monospace" font-size="19" font-weight="800" fill="#10B981">98.50%</text>

      <rect x="300" y="0" width="280" height="68" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text x="318" y="25" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">EDGE THROUGHPUT</text>
      <text x="318" y="50" font-family="'JetBrains Mono', Consolas, monospace" font-size="19" font-weight="800" fill="#38BDF8">30 FPS INT8</text>

      <rect x="600" y="0" width="280" height="68" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text x="618" y="25" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">NPU ACCELERATOR</text>
      <text x="618" y="50" font-family="'JetBrains Mono', Consolas, monospace" font-size="19" font-weight="800" fill="#818CF8">13 TOPS</text>

      <rect x="900" y="0" width="292" height="68" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
      <text x="918" y="25" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">TRAINING CORPUS</text>
      <text x="918" y="50" font-family="'JetBrains Mono', Consolas, monospace" font-size="19" font-weight="800" fill="#F8FAFC">SKU-110K</text>
    </g>
  </g>
</svg>
